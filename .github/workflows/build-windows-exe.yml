name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      npm_config_legacy_peer_deps: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron and Electron Builder
        run: npm install --no-save --legacy-peer-deps electron@33 electron-builder@25

      - name: Build frontend and bundled server
        run: npm run build:desktop

      - name: Package Windows Installer & Portable EXE
        run: npx electron-builder --win --config electron-builder.yml --publish never

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReachPulse-Windows-EXE
          path: |
            release/*.exe
            !release/win-unpacked/**
          retention-days: 30

      - name: Attach EXE to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
