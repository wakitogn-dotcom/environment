appId: com.reachpulse.desktop
productName: ReachPulse
copyright: Copyright © 2026 ReachPulse
directories:
  output: release
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - node_modules/**/*
  - package.json
  - "!node_modules/.cache/**/*"
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}-${target}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
